name: Mirror OSMS

# Once a day, copy any OSMS file whose checksum changed into osms/v1/ and commit it.
# Usually finishes in well under a minute; nothing is committed when nothing changed.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-osms
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/mirror_osms.py
      - name: Commit changes
        run: |
          if git diff --quiet -- osms; then
            echo "OSMS unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osms
          git commit -m "Mirror OSMS $(jq -r .data_updated_at osms/v1/meta.json)"
          git push
